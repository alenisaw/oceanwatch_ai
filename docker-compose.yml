services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      OCEANWATCH_ENV: production
      OCEANWATCH_RUNTIME: cpu
      OCEANWATCH_MODEL_BACKEND: ${OCEANWATCH_MODEL_BACKEND:-deterministic}
      OCEANWATCH_REMOTE_GPU_URL: ${OCEANWATCH_REMOTE_GPU_URL:-}
      OCEANWATCH_REMOTE_GPU_TIMEOUT: ${OCEANWATCH_REMOTE_GPU_TIMEOUT:-60}
      OCEANWATCH_CORS_ORIGINS: ${OCEANWATCH_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      OCEANWATCH_LLM_PROVIDER: ${OCEANWATCH_LLM_PROVIDER:-ollama}
      OCEANWATCH_LLM_MODEL: ${OCEANWATCH_LLM_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oceanwatch}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-oceanwatch}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_files:/static
      - oceanwatch_outputs:/app/outputs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oceanwatch}
      POSTGRES_USER: ${POSTGRES_USER:-oceanwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oceanwatch} -d ${POSTGRES_DB:-oceanwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  static_files:
  oceanwatch_outputs:
