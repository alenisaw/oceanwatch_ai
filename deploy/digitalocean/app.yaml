name: oceanwatch-ai
region: fra

services:
  - name: api
    github:
      repo: alenisaw/oceanwatch_ai
      branch: main
      deploy_on_push: false
    dockerfile_path: docker/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: OCEANWATCH_ENV
        value: production
      - key: OCEANWATCH_RUNTIME
        value: cpu
      - key: OCEANWATCH_REPORTING_MODE
        value: template
      - key: OCEANWATCH_MODEL_BACKEND
        value: deterministic
      - key: OCEANWATCH_REMOTE_GPU_URL
        value: ""
      - key: OCEANWATCH_REMOTE_GPU_TIMEOUT
        value: "60"
      - key: OCEANWATCH_CORS_ORIGINS
        value: ""
